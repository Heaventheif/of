name: Android CI

# (مرحلة 9) CI ضمن بنية المشروع الحالية: نفس أوامر التطوير المحلية بلا
# إضافات جديدة — التحقق من الاعتماديات مفعّل (verification-metadata)
# وكل الترقيات يجب أن تمر من هنا قبل الدمج.

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/verification-metadata.xml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Core unit tests (archive/operations/recovery regression)
        run: ./gradlew :core:test

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Debug build
        run: ./gradlew :app:assembleDebug

      - name: R8 release minification (signing credentials are not in the repo)
        run: ./gradlew :app:minifyReleaseWithR8

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
