name: Build Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Unsigned release APK (no keystore needed)
      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease -PofmAllowUnsignedRelease=true --no-daemon

      - name: Locate APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK" || { echo "No APK found" >&2; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: ${{ env.APK }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: v1.0.0
          files: ${{ env.APK }}
