name: Build Release

# Manual or tag-driven only: an unsigned APK must never be published on every push to main.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed only to create the GitHub release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Tests (gate the release)
        run: ./gradlew :core:test :app:testDebugUnitTest --no-daemon

      # Unsigned release APK (no keystore needed): it cannot be installed over an existing install
      # and is for testing only.
      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease -PofmAllowUnsignedRelease=true --no-daemon

      - name: Locate APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK" || { echo "No APK found" >&2; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: ${{ env.APK }}

      - name: Read version
        run: echo "VER=$(grep -m1 -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: v${{ env.VER }} (unsigned test build)
          prerelease: true
          files: ${{ env.APK }}
