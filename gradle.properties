org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# AGP 8.10 يدعم compileSdk 36 رسمياً؛ السطر التالي احتياط إن حدّثت SDK قبل AGP.
android.suppressUnsupportedCompileSdk=36

# (مرحلة 9) مفتاح تبديل اللغة داخل التطبيق: تعطيل تقسيم الحزم حسب اللغة
# حتى لا تُقص اللغات غير المثبتة على الجهاز من AAB.
android.bundle.language.enableSplit=false
